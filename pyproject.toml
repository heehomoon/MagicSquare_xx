[project]
name = "magicsquare"
version = "0.1.0"
description = "MagicSquare_1004 — 4×4 partial magic square validator (ECB + Dual-Track TDD)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/entity", "src/control", "src/boundary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
